<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantorix - Podiatric Pressure Mapping & Orthotic Engine</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-8 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-700 flex items-center gap-2">
                🏥 Plantorix Orthotic Suite
            </h1>
            <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">Backend API: Online</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-7xl mx-auto flex-grow p-6 grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
        
        <!-- Left Card: Patient Input Panel -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-900 mb-4">Patient Biometric Input</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Patient Body Weight (kg)</label>
                        <input type="number" id="weight" value="70" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Foot Length (cm)</label>
                        <input type="number" id="footLength" value="26.5" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Neuropathy Risk Scale (1 - 5)</label>
                        <input type="number" id="riskScale" min="1" max="5" value="3" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <button onclick="runPressureAnalysis()" class="mt-6 w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl transition shadow-md">
                Run Pressure Analysis
            </button>
        </div>

        <!-- Right Card: Results & Output Panel -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-900 mb-4">AI Simulation & Clinical Output</h2>
                
                <div id="outputPlaceholder" class="text-slate-400 text-center py-12 border-2 border-dashed border-slate-200 rounded-xl">
                    Run analysis to generate pressure distribution matrix and recommendations.
                </div>

                <div id="resultCard" class="hidden space-y-4">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-sm text-slate-500">Peak Plantar Pressure</p>
                        <p id="peakPressure" class="text-2xl font-bold text-teal-700">0 kPa</p>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-sm text-slate-500">Clinical Status</p>
                        <p id="clinicalStatus" class="text-lg font-semibold text-slate-800">-</p>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p class="text-sm text-slate-500">Recommended Insole Offloading Depth</p>
                        <p id="offloadingDepth" class="text-lg font-semibold text-rose-600">0.0 mm</p>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button onclick="alert('Insole blueprint approved for 3D printer export!')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl transition shadow-md">
                    Approve & Export Blueprint
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript to connect Frontend to FastAPI Backend -->
    <script>
        async function runPressureAnalysis() {
            const weight = parseFloat(document.getElementById('weight').value);
            const footLength = parseFloat(document.getElementById('footLength').value);
            const neuropathyRisk = parseInt(document.getElementById('riskScale').value);

            const payload = {
                weight_kg: weight,
                foot_length_cm: footLength,
                neuropathy_risk: neuropathyRisk
            };

            try {
                // Fetch request sent to your running FastAPI backend
                const response = await fetch('http://127.0.0.1:8000/predict-pressure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    // Hide placeholder and show result fields
                    document.getElementById('outputPlaceholder').classList.add('hidden');
                    document.getElementById('resultCard').classList.remove('hidden');

                    // Populate data into UI elements
                    document.getElementById('peakPressure').innerText = `${data.peak_pressure_kpa} kPa`;
                    document.getElementById('clinicalStatus').innerText = data.clinical_status;
                    document.getElementById('offloadingDepth').innerText = `${data.recommended_offloading_depth_mm} mm`;
                }
            } catch (error) {
                alert('Error connecting to backend server. Make sure FastAPI is running!');
                console.error(error);
            }
        }
    </script>
</body>
</html>
